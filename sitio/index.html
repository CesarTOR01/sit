<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.sharepoint.com; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>SIT · Sistema de Información Tornel</title>
<link rel="icon" type="image/svg+xml" href="marca/tornel-isotipo.svg">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="banda">
  <div class="banda-in">
    <button class="pastilla menu-btn" id="menu-btn" aria-expanded="false" aria-controls="lateral">Menú</button>
    <img class="marca-iso marca-claro" src="marca/tornel-isotipo.svg" alt="Laboratorios Tornel" width="44" height="42">
    <img class="marca-iso marca-oscuro" src="marca/tornel-isotipo-oscuro.svg" alt="Laboratorios Tornel" width="44" height="42">
    <div><h1 id="marca">SIT</h1><div class="sub" id="marca-sub">Sistema de Información Tornel</div></div>
    <div class="espacio"></div>
    <button class="pastilla" id="refrescar" hidden>Actualizar</button>
    <button class="pastilla" id="cambiar" hidden>Cambiar fuente</button>
    <button class="pastilla" id="olvidar" hidden>Olvidar este equipo</button>
    <button class="pastilla" id="tema" aria-label="Cambiar entre tema claro y oscuro">Tema</button>
  </div>
</header>

<div class="marco" id="marco" hidden>
  <nav class="lateral" id="lateral" aria-label="Tableros"></nav>
  <main id="contenido" tabindex="-1"></main>
</div>
<main class="conectar" id="conectar" tabindex="-1"></main>

<script type="module" src="app.js"></script>
</body>
</html>
