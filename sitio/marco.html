<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Relevo de los tableros embebidos. No trae datos ni secretos: vive en un marco aislado (sandbox sin allow-same-origin) y no puede pedir nada a la red.
     Su propia política permite lo que los tableros traen en línea; ver.html, donde está la sesión, no lo permite. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:">
<meta name="robots" content="noindex, nofollow">
<title>Marco de tablero</title>
<style>html, body { margin: 0; height: 100%; } iframe { display: block; width: 100%; height: 100%; border: 0; }</style>
</head>
<body>
<iframe id="t" title="Tablero" sandbox="allow-scripts"></iframe>
<script>
(function () {
  if (parent === window || self.origin !== "null") return; // sólo actúa aislado, con origen opaco (sandbox sin allow-same-origin); abierto solo o sin sandbox no hace nada
  var f = document.getElementById("t"), tema = null;
  function limpio(t) { return t === "dark" || t === "light" ? t : null; }
  function darTema() { try { f.contentWindow.postMessage({ sit: "tema", tema: tema }, "*"); } catch (e) { /* el tablero aún no está listo */ } }
  f.addEventListener("load", darTema);
  addEventListener("message", function (e) {
    if (e.source !== parent) return; // sólo se escucha a la página que contiene el marco
    var d = e.data;
    if (!d || typeof d !== "object") return;
    if (d.sit === "tablero" && typeof d.html === "string") f.srcdoc = d.html;
    else if (d.sit === "tema") { tema = limpio(d.tema); darTema(); }
  });
})();
</script>
</body>
</html>
